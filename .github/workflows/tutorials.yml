name: Tutorials

# The tutorials in tutorials/<contrib>/ (tutorials/README.md).
#
#   * On a tag tutorials-vN: a GitHub release tutorials-vN with one tarball per contrib
#     (tutorials/make_tarball.sh), downloaded by
#       curl -L https://github.com/jhputschke/js-contrib/releases/download/tutorials-vN/pyjetscape-tutorials.tar.gz | tar xz
#     The release is never marked "latest": that belongs to js-contrib's code releases (v1.x).
#     Each contrib's VERSION.txt must read vN, the tag's version.
#
#   git tag tutorials-v1 && git push origin tutorials-v1
#
# The tutorials are checked by hand for now, before tagging:
#
#   python tutorials/run_notebooks.py pyjetscape            # every ready tutorial this setup can run
#
# The automatic check below (the analysis tutorials in a plain Python with the pyjetscape wheel,
# as in Colab, on pull requests and pushes to main) is switched off until it has been tried; to
# switch it on, uncomment the job and its triggers, and give the release job "needs: check".

on:
  push:
    tags: ["tutorials-v*"]
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["tutorials/**", ".github/workflows/tutorials.yml"]
  # pull_request:
  #   paths: ["tutorials/**", ".github/workflows/tutorials.yml"]

# env:
#   # what Colab installs (tutorials/pyjetscape/_common/tutorial_env.py, PYJETSCAPE_WHEEL)
#   PYJETSCAPE_WHEEL: "pyjetscape[analysis] @ https://github.com/jhputschke/xscape-macos/releases/download/v0.2.0/pyjetscape-1.4-py3-none-any.whl"

jobs:
  # check:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 60
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #     - name: Install the jetscape readers and the analysis packages
  #       run: |
  #         python -m pip install --upgrade pip
  #         pip install "$PYJETSCAPE_WHEEL" fsspec aiohttp requests nbclient ipykernel google-crc32c
  #     - name: get_data.py with the standard library
  #       run: |
  #         cd tutorials/pyjetscape
  #         python get_data.py --list
  #         python get_data.py oo_test --to "$RUNNER_TEMP/data"
  #     - name: Execute the analysis tutorials
  #       run: python tutorials/run_notebooks.py pyjetscape

  release:
    if: startsWith(github.ref, 'refs/tags/tutorials-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the versions against the tag
        run: |
          want="${GITHUB_REF_NAME#tutorials-}"
          for v in tutorials/*/VERSION.txt; do
            have=$(tr -d '[:space:]' < "$v")
            [ "$have" = "$want" ] || { echo "::error::$v reads '$have', the tag wants '$want'"; exit 1; }
          done
      - name: Build the tarballs
        run: |
          for d in tutorials/*/; do
            [ -f "$d/VERSION.txt" ] && tutorials/make_tarball.sh "$(basename "$d")"
          done
          ls -l dist
      - name: Create the release (not "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*-tutorials.tar.gz \
            --title "Tutorials ${GITHUB_REF_NAME#tutorials-}" --latest=false \
            --notes "The js-contrib tutorials, one tarball per contrib. Get them with:

          curl -L https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/pyjetscape-tutorials.tar.gz | tar xz

          Setting up: https://jhputschke.github.io/js-contrib/tutorials/setup/"
