# ---------------------------------------------------------------------------
# CENTRAL Au+Au 200 GeV for the jet-wake notebook (notebooks/jet_wake.ipynb).
#
# Grid, tau axis, initial state, EoS and liquefier parameters are taken from FNO4d's
# workflow_fastdata/config_AuAu200_central_jet.yaml, so the medium here is the same one that
# config's Mach-cone study was measured on.  Its reasoning is worth reading; the numbers below
# were measured there, not guessed.
#
# ONE THING IS DELIBERATELY DIFFERENT.  That config drives a synthetic parton along a
# prescribed straight trajectory (`source.partons.trajectory`, dE/dx = 2 GeV/fm over 8 fm).
# FastHydro has no such block: the jet comes from X-SCAPE's real energy-loss chain, so the
# droplets are whatever Matter + LBT actually shed, at whatever vertex the binary-collision
# density put the shower. That is the point of the contribution, and it costs some of the
# cone's crispness -- a real shower does not travel in a straight line at fixed dE/dx.
#
# Generate with:  example/make_wake_data.py
# ---------------------------------------------------------------------------

run:
  nevents: 1
  seed:    20260919        # same stream as the FNO4d config
  device:  mps             # cpu | cuda | mps.  mps has no float64 -> dtype must be float32.
  dtype:   float32         # matches float64 to ~1e-6 on q, and `arr` is float32 anyway
  out:     ./out_wake/wake.h5

grid:                      # 65x65 at 0.3125 fm is +-10 fm: checked at b = 2, 7, 11 fm to keep
  nx:   65                 # the energy density on the boundary faces at the vacuum floor
  ny:   65
  neta: 33
  dx:   0.3125
  dy:   0.3125
  deta: 0.3125

time:
  tau0:        0.58        # frame 0 IS the initial condition; must equal <Preequilibrium><taus>
  record_dtau: 0.1
  choose_ntau: 105         # tau = 0.58 .. 11.0 fm/c. A central event with the lattice EoS
                           # freezes out near 9.5 fm; with `conformal` it would be 4.1 fm --
                           # the equation of state, not the viscosity, sets the lifetime.
  cfl:         0.4
  hydro_dtau:  null        # adaptive CFL; the deposit is step-size independent

initial_state:
  kind: mc_glauber
  proj: Au
  targ: Au
  sigma_nn_mb: 42.0
  b:    0.0                # HEAD-ON: the flattest, longest-lived medium there is, which is
                           # what a wake needs -- a background whose own gradients do not
                           # swamp the perturbation.
  require_collision: true
  quantity: entropy
  target_T: 0.30           # <T> = 0.30 GeV at b = 0; hot spot T = 0.385, e = 44.7 GeV/fm^3
  calib_b:      0.0
  calib_events: 25         # Au+Au fluctuates far less than d+Au, so this is plenty
  e_floor: 1.0e-6
  profile:                 # Bozek-Wyskiel tilted source
    w:            0.4
    alpha:        0.145
    eta0:         1.5
    sig_eta:      1.3
    eta_m:        3.36
    gamma_k:      null
    string_fluct: false
    edge:         0.3

eos:
  kind: hotqcd_smash       # the lattice EoS is what gives Au+Au its ~9.5 fm lifetime
  path: ./eos/hotQCD       # relative to the working directory (the X-SCAPE build tree)
  download: true           # fetch MUSIC's table on first use if it is not there.
                           # make_wake_data.py normally does this once, up front, so the run
                           # itself finds it already in place; this is the fallback for using
                           # the config directly. Pre-fetch for an offline machine with
                           #   python -c "from fast_data.eos import download_hotqcd; \
                           #              download_hotqcd('eos/hotQCD')"
  store_table: true        # so the file is self-contained and mach_angle() works
  n_points: 1500

transport:
  mode: ideal              # make_wake_data.py overrides this per leg
  eta_over_s:   0.08
  zeta_over_s:  0.0
  tau_pi_coeff: 5.0

source:
  # HOW a droplet is deposited onto the grid. Every key here is read, on every jet run --
  # live (droplets from Matter+LBT) and replay (droplets from a dump) alike.
  #
  # WHERE droplets come from is not configured here at all: they come from X-SCAPE's
  # energy-loss chain. fast_data's schema also carries `enabled`, `model`, `partons`,
  # `per_event` and `placement_weight` for its own generate.py, which synthesises droplets
  # from a parton spec; none of them is read by FastHydro, so they are left at their
  # defaults rather than written out as knobs that do nothing. (`enabled` defaults to
  # false, and build_two_stage() refuses to run if it is true, because a `partons:` spec
  # would then be silently ignored.)
  mode:    conservative    # NOT xscape: point sampling loses the deposit entirely at large
                           # |eta_d| on this grid. See fasthydro/liquefier_bridge.py.
  renorm:  grid
  tau_eval_mode: dep
  n_sub:     auto
  n_sub_max: 24
  min_in_grid:    0.99
  on_out_of_grid: warn
output:
  compression:        lzf
  source_compression: gzip
  T_fo:               0.150
  freezeout:          max_T
  zero_after_freezeout: true
  # Both legs must span the same frames for the pair to be comparable, and the jet leg keeps
  # evolving while droplets are still depositing, so neither may stop early.
  stop_at_freezeout:  false
  write_source:       true
  write_diagnostics:  true

fasthydro:
  hard_vertex:
    mode: ncoll            # sample the shower vertex from the binary-collision density.
    smear: 0.4             # `centre` would pin every shower to the fireball centre.
  hydro:
    store: vector
    store_fields: null
    accept_preeq_flow_loss: false
