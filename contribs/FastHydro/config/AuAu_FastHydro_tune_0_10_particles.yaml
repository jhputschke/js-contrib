# ---------------------------------------------------------------------------
# 0-10% Au+Au 200 GeV, FastHydro TUNED to 3D MC-Glauber + MUSIC (calibrated), PARTICLIZED.
# Pairs with config/AuAu_FastHydro_tune_0_10_particles.xml; for jets on this medium see
# AuAu_FastHydro_tune_0_10_wake.{yaml,xml}.  The tune (notebooks/bulk_vs_music.ipynb, README
# "Bulk comparison with MUSIC + 3D MC-Glauber"):
#
#   time.tau0                  0.58 -> 0.5    the Trento-based 2+1D static medium's start
#   initial_state.b            0    -> [0, 4.7] fm, P(b) ~ b: 0-10% (geometric, sigma_NN 42 mb)
#   initial_state.target_T     0.39 -> 0.418  still calibrated at calib_b = 0
#   transport.mode             israel_stewart, eta/s 0.08
#   transport.zeta_over_s      0    -> 0.12   constant; brings <pT> down to MUSIC's
#   transport.Pi_p_bounds      [-0.9, 0.3]    fast_data's default; REQUIRED with zeta/s > 0
#
# Measured, 25 events x 100 oversamples, mid-rapidity, against MUSIC calibrated (667 +- 18):
#     dN_ch/deta 659 +- 16 (-1%)
#     <pT> / MUSIC   pi 1.02, K 0.99, p 0.93
#     dN/dy          pi+ 305, K+ 58, p 18   (MUSIC: 303, 57, 26)
# Not matched: protons are 7% softer and fewer at high pT (charged <pT> -2 to -3%), and dN/deta
# is 7-9% wider at |eta| ~ 3.  Shear goes the other way: eta/s 0.16 hardens <pT> by 2-4%.
# Every event closes; the latest freeze-out is at 13.2 fm/c, inside the 14.9 fm/c axis.
#
# Everything else is fasthydro_particlize.yaml's, including why each output setting is what it
# is: a Cooper-Frye surface needs frames that are neither zeroed nor skipped, and EOS 9 (UrQMD
# list) is the one iSS decays without SMASH.  iSS gets no delta-f: FastHydro hands it
# pi = Pi = 0.  The eta edges are open, so analyse at mid-rapidity.
#
# Run (from the X-SCAPE build tree):
#   python $C/example/run_particlize.py --leg bg --events 25 --oversample 100 \
#       --config $C/config/AuAu_FastHydro_tune_0_10_particles.yaml \
#       --user-xml $C/config/AuAu_FastHydro_tune_0_10_particles.xml --set run.device=cuda
# or, next to MUSIC in the bulk notebook:
#   python $C/example/make_bulk_comparison_data.py --models fasthydro --device cuda \
#       --fh-config $C/config/AuAu_FastHydro_tune_0_10_particles.yaml \
#       --fh-xml $C/config/AuAu_FastHydro_tune_0_10_particles.xml --fh-tag tune_0_10
# ---------------------------------------------------------------------------

run:
  nevents: 1
  seed:    20260919
  device:  mps             # cpu | cuda | mps.  mps has no float64 -> dtype must be float32.
  dtype:   float32
  out:     null            # run_particlize.py writes hadrons, not the hydro pair

grid:
  nx:   65
  ny:   65
  neta: 33
  dx:   0.3125
  dy:   0.3125
  deta: 0.3125

time:
  tau0:        0.5         # must equal <Preequilibrium><taus>
  record_dtau: 0.1
  choose_ntau: 145         # tau = 0.5 .. 14.9 fm/c; the tuned medium freezes out by 13.2
  cfl:         0.4
  hydro_dtau:  null

initial_state:
  kind: mc_glauber
  proj: Au
  targ: Au
  sigma_nn_mb: 42.0
  b:    [0.0, 4.7]         # 0-10%, P(b) ~ b
  require_collision: true
  quantity: entropy
  target_T: 0.418          # -> dN_ch/deta 659 at |eta| < 0.5, 0-10% (MUSIC calibrated: 667)
  calib_b:      0.0        # K is calibrated at b = 0 and applied to every b
  calib_events: 25
  e_floor: 1.0e-6
  profile:
    w:            0.4
    alpha:        0.145
    eta0:         1.5
    sig_eta:      1.3
    eta_m:        3.36
    gamma_k:      null
    string_fluct: false
    edge:         0.3

eos:
  kind: hotqcd             # EOS 9 / UrQMD list: iSS decays the resonances
  path: ./eos/hotQCD       # relative to the working directory (the X-SCAPE build tree)
  download: true
  store_table: true
  n_points: 1500

transport:
  mode: israel_stewart
  eta_over_s:   0.08
  zeta_over_s:  0.12       # needs Pi_p_bounds (below)
  tau_pi_coeff: 5.0
  pi_e_min:     0.01       # as fasthydro_particlize.yaml
  Pi_p_bounds:  [-0.9, 0.3]   # bound bulk Pi/p every step (fast_data's default, spelled out):
                           # without it 0-10% events diverge at zeta/s > 0 (fv.viscous_step)

source:                    # how droplets are deposited; see fasthydro_wake.yaml
  mode:    conservative
  renorm:  grid
  tau_eval_mode: dep
  n_sub:     auto
  n_sub_max: 24
  min_in_grid:    0.99
  on_out_of_grid: warn

output:
  compression:        blosc-zstd   # was lzf; README_h5_optim.md
  source_compression: gzip
  keep_bits:          null         # N: round arr/arr_bg to N mantissa bits (lossy)
  T_fo:               0.150      # only labels the freeze-out frame in the diagnostics
  freezeout:          max_T
  zero_after_freezeout: false
  stop_at_freezeout:  false
  write_source:       true
  write_diagnostics:  true

fasthydro:
  hard_vertex:
    mode: ncoll
    smear: 0.4
  store_showers: true
  hydro:
    store: vector
    store_fields: null
    accept_preeq_flow_loss: false
