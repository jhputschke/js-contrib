[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjetscape"
# the version is js-contrib's release tag (vX.Y -> X.Y), see [tool.setuptools_scm]
dynamic = ["version"]
description = "Python bindings for the JETSCAPE/X-SCAPE framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
# The default install covers the HDF5 writers/readers, the prod_AuAu_0_10* example scripts
# and their notebooks.  The compiled pyjetscape_core is built by CMake, not by pip.
dependencies = [
    "numpy>=1.21",
    "h5py>=3",
    # the Blosc filter of the default compression (README_h5_optim.md); without it the
    # writers fall back to lzf with a warning and Blosc files cannot be read
    "hdf5plugin",
    "pyyaml>=6.0",        # grid YAML of run_prod.py / run_prod_jet.py
    # notebooks: check_output.ipynb (pandas, ipywidgets), jet_wake.ipynb (scipy)
    "matplotlib>=3.5",
    "scipy>=1.9",
    "pandas",
    "ipywidgets>=8",
    "ipykernel",
    "notebook>=7",
]

[project.optional-dependencies]
# PyFNOHydro only; torch is imported lazily, everything else works without it
fno = ["torch>=2.0"]
# bulk_root_writer.py / fast_root_bulk.py (read ROOT bulk files without ROOT)
root = ["uproot>=5"]
# the analysis environment: the list of utils/analysis_env/requirements.txt, which the
# production image installs too (tests/test_install_paths.py keeps the two the same)
analysis = [
    "numpy>=1.25",
    "h5py>=3.8",
    "hdf5plugin",
    "pyyaml>=6.0",
    "uproot>=5",
    "awkward>=2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas",
    "fastjet>=3.4",
    "vector>=1",
    "particle",
    "hist",
    "mplhep",
    "notebook>=7",
    "ipykernel",
    "ipywidgets>=8",
    "pytest>=7.0",
    "rich>=13",
    "textual>=8",
    "pelicanfs>=1.0",
    "aiowebdav2<1",
]

[project.scripts]
# a writable copy of example/ (the installed or image tree is read-only)
xscape-examples = "jetscape.copy_examples:main"
# a writable copy of js-contrib's utils/ (jobmon, prodwizard, h5_inspect, remote_transfer)
xscape-utils = "jetscape.copy_examples:utils_main"

[tool.setuptools.packages.find]
where = ["python"]

# The version comes from js-contrib's git tags v<X.Y> (the release tags; tutorials-v* and
# other tags are ignored): at a tag it is X.Y, after it X.(Y+1).devN+g<commit> (+.d<date>
# with uncommitted changes).  A build from a copy without js-contrib's .git must fix it with
# SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYJETSCAPE=X.Y (the macOS wheel's build_wheel.sh does):
# a copy inside another git repository would otherwise take that repository's tags, and one
# outside any gets 0+unknown.
# An editable install (pip install -e) keeps the version of the moment it was installed.
[tool.setuptools_scm]
root = "../.."
tag_regex = '^v(?P<version>\d+(?:\.\d+)*)$'
fallback_version = "0+unknown"

[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
