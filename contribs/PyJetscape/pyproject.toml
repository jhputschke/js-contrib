[build-system]
requires = ["setuptools>=61", "pybind11>=2.11"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pyjetscape"
version = "0.1.0"
description = "Python bindings for the JETSCAPE/X-SCAPE framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy",
    "torch",
]

[project.optional-dependencies]
# jetscape.fast_h5_bulk (HDF5 bulk writer); scipy is only needed for the "grid" and
# "framework" source modes, which resample onto a user grid.
hdf5 = ["h5py", "scipy"]

[tool.setuptools.packages.find]
where = ["python"]
