# Output grid for run_prod.py: the FNO grid cut to |eta_s| <= 2.5 (same 0.3125 spacing).
# 17 instead of 33 eta cells: about half the storage (~100 MB per event).
# See grid_fno.yaml for what every key means.

grid:
  x:   {min: -10.0, max: 10.0, n: 65}
  y:   {min: -10.0, max: 10.0, n: 65}
  eta: {min: -2.5,  max: 2.5,  n: 17}

tau:
  min: 0.5
  dtau: 0.1
  max_ntau: 0        # grow; reconcile files with python ../../python/jetscape/repad_h5.py before training
